# Mémoire de Gradle : 4 Go suffisent pour cette application (8 Go ralentissaient le PC)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Le projet est sur G: et le cache des paquets Flutter sur C: : la compilation Kotlin
# « incrémentale » ne gère pas deux disques différents (« different roots »). On la désactive.
kotlin.incremental=false
