# =====================================================================
# Application Android : compilation, signature et publication automatiques.
# À chaque modification de apps/mobile poussée sur main, GitHub :
#   1. lance les tests de l'application ;
#   2. compile l'APK signée avec la clé officielle (secrets du dépôt) ;
#   3. la publie dans les « Releases » du dépôt, avec version.json.
# Liens permanents (toujours la dernière version) :
#   https://github.com/Kamelcherif2026/wa9tech/releases/latest/download/wa9tech.apk
#   https://github.com/Kamelcherif2026/wa9tech/releases/latest/download/version.json
# =====================================================================
name: Application Android

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: # bouton « Run workflow » pour relancer à la main

permissions:
  contents: write # nécessaire pour créer la release

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    name: APK signée
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Même version de Flutter que sur le PC de développement (une version plus récente peut
      # exiger d'autres versions d'outils Android). À changer ici quand on met Flutter à jour.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Configuration (Supabase, site)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_PUBLISHABLE_KEY" && test -n "$SITE_URL" \
            || { echo "::error::Variables SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY ou SITE_URL manquantes (Settings > Secrets and variables > Actions > Variables)"; exit 1; }
          mkdir -p env
          jq -n --arg u "$SUPABASE_URL" --arg k "$SUPABASE_PUBLISHABLE_KEY" --arg s "$SITE_URL" \
            '{SUPABASE_URL: $u, SUPABASE_PUBLISHABLE_KEY: $k, SITE_URL: $s}' > env/ci.json

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant"; exit 1; }
          # Espaces et retours à la ligne ajoutés par le copier-coller retirés avant décodage
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > android/app/wa9tech-upload.jks \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 n'est pas un texte base64 valide : recopiez-le (voir docs)"; exit 1; }
          # Vérifie que la clé s'ouvre avec le mot de passe et l'alias fournis
          keytool -list -keystore android/app/wa9tech-upload.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::Clé illisible : mot de passe (ANDROID_KEYSTORE_PASSWORD) ou alias (ANDROID_KEY_ALIAS) incorrect"; exit 1; }
          {
            echo "storeFile=wa9tech-upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Numéro de version
        run: |
          NOM=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//' | tr -d '\r')
          NUM=$((100 + GITHUB_RUN_NUMBER))
          echo "NOM=$NOM" >> "$GITHUB_ENV"
          echo "NUM=$NUM" >> "$GITHUB_ENV"
          echo "Version $NOM ($NUM)"

      - name: Compilation
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="$NOM" --build-number="$NUM" \
            --dart-define-from-file=env/ci.json

      - name: Préparation des fichiers
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/wa9tech.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/wa9tech-anciens-telephones.apk
          jq -n --arg v "$NOM" --argjson b "$NUM" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg n "$(git log -1 --pretty=%s)" \
            '{version: $v, build: $b, date: $d, notes: $n}' > dist/version.json
          cat dist/version.json
          rm -f android/key.properties android/app/wa9tech-upload.jks

      - name: Publication
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ env.NOM }}-${{ env.NUM }}
          name: Application Android ${{ env.NOM }} (${{ env.NUM }})
          body: |
            Version ${{ env.NOM }} (${{ env.NUM }}) de l'application WA9TECH pour Android.
            - wa9tech.apk : téléphones récents (64 bits) — le bon choix dans presque tous les cas
            - wa9tech-anciens-telephones.apk : anciens téléphones (32 bits)
          files: |
            apps/mobile/dist/wa9tech.apk
            apps/mobile/dist/wa9tech-anciens-telephones.apk
            apps/mobile/dist/version.json
          make_latest: true
