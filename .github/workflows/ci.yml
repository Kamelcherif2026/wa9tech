name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    name: Base de données (migrations + tests pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Démarrer PostgreSQL Supabase
        run: supabase db start

      - name: Lint SQL
        run: supabase db lint --level error

      - name: Tests pgTAP
        run: supabase test db
